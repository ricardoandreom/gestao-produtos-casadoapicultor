<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Casa do Apicultor — Gestão de Encomendas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0e0b; --surface: #1a1916; --surface2: #222118;
      --border: #2e2c25; --accent: #e8b84b; --accent2: #c9943a;
      --text: #f0ece0; --muted: #7a776a; --danger: #c0392b;
      --success: #4caf83; --radius: 10px;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* HEADER */
    header { flex-shrink: 0; padding: 14px 36px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 20px; background: var(--surface); }
    .logo-img { height: 52px; width: auto; }
    .logo-divider { width: 1px; height: 36px; background: var(--border); }
    .logo-text { display: flex; flex-direction: column; gap: 2px; }
    .logo-name { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 800; color: var(--accent); letter-spacing: 0.3px; }
    .logo-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
    .header-badge { margin-left: auto; background: var(--accent); color: #000; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }

    /* MAIN */
    .main-area { flex: 1; display: grid; grid-template-columns: 420px 1fr; min-height: 0; }

    /* FORM PANEL */
    .panel-form { background: var(--surface); border-right: 1px solid var(--border); padding: 32px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
    .section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .form-group input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 14px; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--accent); }
    .tipo-group { display: flex; gap: 10px; }
    .tipo-btn { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--muted); font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
    .tipo-btn.active { border-color: var(--accent); background: rgba(232,184,75,0.12); color: var(--accent); }
    .produtos-lista { display: flex; flex-direction: column; gap: 8px; }
    .produto-row { display: grid; grid-template-columns: 1fr 80px 32px; gap: 8px; align-items: start; }
    .produto-row input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; padding: 8px 12px; outline: none; font-family: 'Inter', sans-serif; transition: border-color 0.2s; }
    .produto-row input:focus { border-color: var(--accent); }
    .produto-row input[type="number"] { text-align: center; }
    .produto-wrap { display: flex; flex-direction: column; gap: 4px; }
    .prod-notas { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); font-size: 11px; font-family: 'Inter', sans-serif; padding: 5px 12px; outline: none; resize: none; transition: border-color 0.2s, color 0.2s; height: 36px; line-height: 1.4; }
    .prod-notas::placeholder { color: var(--border); font-style: italic; }
    .prod-notas:focus { border-color: rgba(232,184,75,0.4); color: var(--text); }
    .btn-remove { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 16px; cursor: pointer; height: 34px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .btn-remove:hover { border-color: var(--danger); color: var(--danger); }
    .btn-add-produto { background: none; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); font-size: 13px; padding: 9px; cursor: pointer; width: 100%; font-family: 'Inter', sans-serif; transition: all 0.2s; }
    .btn-add-produto:hover { border-color: var(--accent); color: var(--accent); }
    .btn-submit { background: var(--accent); border: none; border-radius: var(--radius); color: #000; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; padding: 14px; cursor: pointer; width: 100%; letter-spacing: 0.5px; transition: background 0.2s, transform 0.1s; }
    .btn-submit:hover { background: var(--accent2); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .divider { border: none; border-top: 1px solid var(--border); }
    .col-labels { display: grid; grid-template-columns: 1fr 80px; gap: 8px; padding: 0 0 4px 0; }
    .col-labels span { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding-left: 2px; }

    /* TOAST */
    #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--success); color: #000; font-weight: 600; padding: 12px 24px; border-radius: 30px; font-size: 14px; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 1000; }
    #toast.error { background: var(--danger); color: #fff; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* HISTORICO PANEL */
    .panel-historico { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .historico-top { flex-shrink: 0; padding: 28px 36px 0; }
    .historico-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .historico-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; }
    #contador { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

    /* FILTROS */
    .filtros-row { display: flex; gap: 8px; align-items: flex-end; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .filtro-item { display: flex; flex-direction: column; gap: 4px; position: relative; }
    .filtro-lbl { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

    .ms-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 4px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
      color: var(--muted); font-family: 'Inter', sans-serif; font-size: 12px;
      padding: 6px 8px 6px 10px; cursor: pointer; transition: border-color 0.2s, color 0.2s;
      white-space: nowrap; text-align: left; min-width: 0;
    }
    .ms-trigger:hover { border-color: var(--accent); }
    .ms-trigger.active { border-color: var(--accent); color: var(--accent); }
    .ms-trigger-text { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .ms-arrow { font-size: 9px; color: var(--muted); flex-shrink: 0; transition: transform 0.15s; }
    .ms-trigger.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-color: var(--accent); }
    .ms-trigger.open .ms-arrow { transform: rotate(180deg); }

    .f-id     { width: 110px; }
    .f-data   { width: 130px; }
    .f-client { width: 145px; }
    .f-tipo   { width: 100px; }
    .f-prod   { width: 155px; }

    .ms-panel {
      display: none; position: absolute; top: 100%; left: 0; min-width: 100%;
      background: var(--surface); border: 1px solid var(--accent); border-top: none;
      border-radius: 0 0 8px 8px; z-index: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55);
      flex-direction: column; max-height: 240px;
    }
    .ms-panel.open { display: flex; }
    .ms-search-wrap { padding: 7px 8px 5px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .ms-search { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 11px; font-family: 'Inter', sans-serif; padding: 4px 8px; outline: none; }
    .ms-search:focus { border-color: var(--accent); }
    .ms-list { overflow-y: auto; flex: 1; }
    .ms-list::-webkit-scrollbar { width: 4px; }
    .ms-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .ms-opt { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; font-size: 12px; user-select: none; }
    .ms-opt:hover { background: rgba(232,184,75,0.08); }
    .ms-opt input[type="checkbox"] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }
    .ms-opt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .ms-opt.hidden { display: none; }
    .ms-footer { padding: 5px 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .ms-footer-btn { background: none; border: none; font-size: 11px; cursor: pointer; font-family: 'Inter', sans-serif; padding: 2px 4px; transition: color 0.15s; color: var(--muted); }
    .ms-footer-btn:hover { color: var(--accent); }
    .ms-footer-btn.danger:hover { color: var(--danger); }

    .btn-limpar-tudo { background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--muted); font-size: 11px; padding: 6px 12px; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; transition: all 0.2s; height: 31px; }
    .btn-limpar-tudo:hover { border-color: var(--danger); color: var(--danger); }

    /* TABELA */
    .tabela-scroll { flex: 1; overflow-y: auto; padding: 0 36px 24px; }
    .tabela-scroll::-webkit-scrollbar { width: 6px; }
    .tabela-scroll::-webkit-scrollbar-track { background: transparent; }
    .tabela-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .tabela-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { position: sticky; top: 0; background: var(--bg); z-index: 1; }
    thead tr { border-bottom: 1px solid var(--border); }
    th { text-align: left; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 12px 14px 10px 0; font-weight: 500; }
    td { padding: 13px 14px 13px 0; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text); }
    tr:hover td { background: rgba(255,255,255,0.02); }
    tr:last-child td { border-bottom: none; }
    .badge-tipo { display: inline-block; padding: 3px 9px; border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; }
    .badge-AM { background: rgba(232,184,75,0.15); color: var(--accent); }
    .badge-FR { background: rgba(76,175,131,0.15); color: var(--success); }
    .produtos-cell { display: flex; flex-direction: column; gap: 3px; }
    .produto-tag { font-size: 12px; color: var(--muted); }
    .produto-tag strong { color: var(--text); font-weight: 500; }
    .produto-tag-nota { font-size: 11px; color: var(--muted); font-style: italic; padding-left: 2px; }
    .btn-download { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; padding: 6px 12px; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; transition: all 0.2s; }
    .btn-download:hover { border-color: var(--accent); color: var(--accent); }
    .btn-excel { background: rgba(76,175,131,0.1); border: 1px solid rgba(76,175,131,0.3); border-radius: 6px; color: var(--success); font-size: 12px; font-weight: 600; padding: 6px 14px; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; transition: all 0.2s; }
    .btn-excel:hover { background: rgba(76,175,131,0.2); border-color: var(--success); }
    .btn-toggle-chart { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; padding: 6px 12px; cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; transition: all 0.2s; }
    .btn-toggle-chart:hover, .btn-toggle-chart.active { border-color: var(--accent); color: var(--accent); background: rgba(232,184,75,0.08); }
    .empty-state { text-align: center; padding: 60px 0; color: var(--muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }


  </style>
</head>
<body>

<header>
  <img src="/static/logo.png" alt="Casa do Apicultor" class="logo-img"/>
  <div class="logo-divider"></div>
  <div class="logo-text">
    <div class="logo-name">Casa do Apicultor</div>
    <div class="logo-sub">Gestão de Encomendas</div>
  </div>
  <div class="header-badge">v1.0</div>
</header>

<div class="main-area">
  <!-- FORM -->
  <div class="panel-form">
    <div>
      <div class="section-label">Nova Encomenda</div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="form-group">
          <label>Nome do Cliente</label>
          <input type="text" id="cliente" placeholder="Ex: João Silva" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label>Tipo de Cliente</label>
          <div class="tipo-group">
            <div class="tipo-btn active" data-tipo="AM" onclick="selecionarTipo('AM')">AM</div>
            <div class="tipo-btn" data-tipo="FR" onclick="selecionarTipo('FR')">FR</div>
          </div>
        </div>
      </div>
    </div>
    <hr class="divider"/>
    <div>
      <div class="section-label">Produtos</div>
      <div class="col-labels"><span>Produto</span><span>Qtd.</span></div>
      <div class="produtos-lista" id="produtos-lista"></div>
      <button class="btn-add-produto" onclick="adicionarProduto()" style="margin-top:10px;">+ Adicionar produto</button>
    </div>
    <hr class="divider"/>
    <button class="btn-submit" id="btn-submit" onclick="submeterEncomenda()">Gerar Encomenda</button>
  </div>

  <!-- HISTORICO -->
  <div class="panel-historico">
    <div class="historico-top">
      <div class="historico-header">
        <div class="historico-title">Histórico</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div id="contador">— encomendas</div>
          <button class="btn-toggle-chart" onclick="window.location.href='/graficos'">📈 Gráficos</button>
          <button class="btn-toggle-chart" onclick="window.location.href='/mapeamento'">🗂 Mapeamento</button>
          <button class="btn-excel" onclick="exportarExcel()">⬇ Excel</button>
        </div>
      </div>

      <!-- FILTROS -->
      <div class="filtros-row">
        <!-- Nº -->
        <div class="filtro-item" id="fi-id">
          <span class="filtro-lbl">Nº</span>
          <button class="ms-trigger f-id" id="trig-id" onclick="msAbrir('id')">
            <span class="ms-trigger-text" id="tlbl-id">Todos</span><span class="ms-arrow">▾</span>
          </button>
          <div class="ms-panel" id="pan-id">
            <div class="ms-search-wrap"><input class="ms-search" placeholder="Pesquisar…" oninput="msPesquisar('id',this.value)"/></div>
            <div class="ms-list" id="lst-id"></div>
            <div class="ms-footer">
              <button class="ms-footer-btn" onclick="msSelectAll('id')">Sel. todos</button>
              <button class="ms-footer-btn danger" onclick="msLimpar('id')">Limpar</button>
            </div>
          </div>
        </div>
        <!-- Data -->
        <div class="filtro-item" id="fi-data">
          <span class="filtro-lbl">Data</span>
          <button class="ms-trigger f-data" id="trig-data" onclick="msAbrir('data')">
            <span class="ms-trigger-text" id="tlbl-data">Todas</span><span class="ms-arrow">▾</span>
          </button>
          <div class="ms-panel" id="pan-data">
            <div class="ms-search-wrap"><input class="ms-search" placeholder="Pesquisar…" oninput="msPesquisar('data',this.value)"/></div>
            <div class="ms-list" id="lst-data"></div>
            <div class="ms-footer">
              <button class="ms-footer-btn" onclick="msSelectAll('data')">Sel. todos</button>
              <button class="ms-footer-btn danger" onclick="msLimpar('data')">Limpar</button>
            </div>
          </div>
        </div>
        <!-- Cliente -->
        <div class="filtro-item" id="fi-cliente">
          <span class="filtro-lbl">Cliente</span>
          <button class="ms-trigger f-client" id="trig-cliente" onclick="msAbrir('cliente')">
            <span class="ms-trigger-text" id="tlbl-cliente">Todos</span><span class="ms-arrow">▾</span>
          </button>
          <div class="ms-panel" id="pan-cliente">
            <div class="ms-search-wrap"><input class="ms-search" placeholder="Pesquisar…" oninput="msPesquisar('cliente',this.value)"/></div>
            <div class="ms-list" id="lst-cliente"></div>
            <div class="ms-footer">
              <button class="ms-footer-btn" onclick="msSelectAll('cliente')">Sel. todos</button>
              <button class="ms-footer-btn danger" onclick="msLimpar('cliente')">Limpar</button>
            </div>
          </div>
        </div>
        <!-- Tipo -->
        <div class="filtro-item" id="fi-tipo">
          <span class="filtro-lbl">Tipo</span>
          <button class="ms-trigger f-tipo" id="trig-tipo" onclick="msAbrir('tipo')">
            <span class="ms-trigger-text" id="tlbl-tipo">Todos</span><span class="ms-arrow">▾</span>
          </button>
          <div class="ms-panel" id="pan-tipo">
            <div class="ms-list" id="lst-tipo"></div>
            <div class="ms-footer">
              <button class="ms-footer-btn" onclick="msSelectAll('tipo')">Sel. todos</button>
              <button class="ms-footer-btn danger" onclick="msLimpar('tipo')">Limpar</button>
            </div>
          </div>
        </div>
        <!-- Produto -->
        <div class="filtro-item" id="fi-produto">
          <span class="filtro-lbl">Produto</span>
          <button class="ms-trigger f-prod" id="trig-produto" onclick="msAbrir('produto')">
            <span class="ms-trigger-text" id="tlbl-produto">Todos</span><span class="ms-arrow">▾</span>
          </button>
          <div class="ms-panel" id="pan-produto">
            <div class="ms-search-wrap"><input class="ms-search" placeholder="Pesquisar…" oninput="msPesquisar('produto',this.value)"/></div>
            <div class="ms-list" id="lst-produto"></div>
            <div class="ms-footer">
              <button class="ms-footer-btn" onclick="msSelectAll('produto')">Sel. todos</button>
              <button class="ms-footer-btn danger" onclick="msLimpar('produto')">Limpar</button>
            </div>
          </div>
        </div>
        <button class="btn-limpar-tudo" onclick="msSelecionarTudo()">✓ Selecionar tudo</button>
        <button class="btn-limpar-tudo" onclick="msLimparTudo()">✕ Limpar tudo</button>
      </div>
    </div>

    <div class="tabela-scroll">
      <table>
        <thead><tr><th>#</th><th>Data</th><th>Cliente</th><th>Tipo</th><th>Produtos</th><th>Doc</th></tr></thead>
        <tbody id="tabela-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="icon">📋</div><p>Nenhuma encomenda encontrada.</p>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
'use strict';

let tipoSelecionado = 'AM';
let todasEncomendas = [];

function selecionarTipo(tipo) {
  tipoSelecionado = tipo;
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.toggle('active', b.dataset.tipo === tipo));
}

function adicionarProduto(nome = '', qty = '', notas = '') {
  const lista = document.getElementById('produtos-lista');
  const row = document.createElement('div');
  row.className = 'produto-row';
  row.innerHTML = `
    <div class="produto-wrap">
      <input type="text" placeholder="Nome do produto" value="${nome}" class="prod-nome"/>
      <textarea class="prod-notas" placeholder="Notas (opcional)...">${notas}</textarea>
    </div>
    <input type="number" placeholder="Qtd" min="1" value="${qty}" class="prod-qty" style="align-self:start;"/>
    <button class="btn-remove" onclick="this.closest('.produto-row').remove()">✕</button>
  `;
  lista.appendChild(row);
  row.querySelector('.prod-nome').focus();
}

async function submeterEncomenda() {
  const cliente = document.getElementById('cliente').value.trim();
  if (!cliente) return toast('Preenche o nome do cliente.', true);
  const rows = document.querySelectorAll('.produto-row');
  const produtos = [];
  for (const row of rows) {
    const nome  = row.querySelector('.prod-nome').value.trim();
    const qty   = parseInt(row.querySelector('.prod-qty').value);
    const notas = row.querySelector('.prod-notas').value.trim();
    if (!nome) return toast('Preenche o nome de todos os produtos.', true);
    if (!qty || qty < 1) return toast('A quantidade deve ser pelo menos 1.', true);
    produtos.push({ nome, quantidade: qty, notas: notas || '' });
  }
  if (!produtos.length) return toast('Adiciona pelo menos um produto.', true);
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'A gerar...';
  try {
    const res  = await fetch('/api/encomendas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cliente, cliente_tipo: tipoSelecionado, produtos }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Erro desconhecido.');
    toast(data.mensagem);
    document.getElementById('cliente').value = '';
    document.getElementById('produtos-lista').innerHTML = '';
    adicionarProduto();
    await carregarHistorico();
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Gerar Encomenda'; }
}

const CAMPOS = ['id','data','cliente','tipo','produto'];
const msOpcoes = { id: [], data: [], cliente: [], tipo: [], produto: [] };

function msGetValores(campo) {
  const s = new Set();
  todasEncomendas.forEach(e => {
    if      (campo === 'id')      s.add(String(e.id).padStart(4,'0'));
    else if (campo === 'data')    s.add(e.data);
    else if (campo === 'cliente') s.add(e.cliente);
    else if (campo === 'tipo')    s.add(e.cliente_tipo);
    else if (campo === 'produto') e.produtos.forEach(p => s.add(p.nome));
  });
  return [...s].sort((a, b) => {
    if (campo === 'id') return Number(a) - Number(b);
    if (campo === 'data') { const p = x => { const [d,m,y] = x.split('/').map(Number); return new Date(y,m-1,d); }; return p(a) - p(b); }
    return a.localeCompare(b, 'pt');
  });
}

function msInicializar(campo) {
  const valores = msGetValores(campo);
  const lst = document.getElementById('lst-' + campo);
  lst.innerHTML = '';
  msOpcoes[campo] = [];
  valores.forEach(val => {
    const entry = { val, checked: true };
    msOpcoes[campo].push(entry);
    const div = document.createElement('div');
    div.className = 'ms-opt';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.addEventListener('change', () => { entry.checked = cb.checked; msAtualizarLabel(campo); aplicarFiltros(); });
    const span = document.createElement('span');
    span.textContent = val; span.title = val;
    div.appendChild(cb); div.appendChild(span);
    lst.appendChild(div);
  });
  msAtualizarLabel(campo);
}

function msPesquisar(campo, q) {
  const lq = q.toLowerCase();
  document.querySelectorAll(`#lst-${campo} .ms-opt`).forEach(d =>
    d.classList.toggle('hidden', !d.querySelector('span').textContent.toLowerCase().includes(lq)));
}

function msAbrir(campo) {
  const isOpen = document.getElementById('pan-' + campo).classList.contains('open');
  CAMPOS.forEach(c => {
    document.getElementById('pan-' + c).classList.remove('open');
    document.getElementById('trig-' + c).classList.remove('open');
    const si = document.querySelector(`#pan-${c} .ms-search`);
    if (si) { si.value = ''; msPesquisar(c, ''); }
  });
  if (!isOpen) {
    document.getElementById('pan-' + campo).classList.add('open');
    document.getElementById('trig-' + campo).classList.add('open');
    const si = document.querySelector(`#pan-${campo} .ms-search`);
    if (si) setTimeout(() => si.focus(), 40);
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.filtro-item')) {
    CAMPOS.forEach(c => {
      document.getElementById('pan-' + c)?.classList.remove('open');
      document.getElementById('trig-' + c)?.classList.remove('open');
    });
  }
});

function msSelectAll(campo) {
  msOpcoes[campo].forEach(e => e.checked = true);
  document.querySelectorAll(`#lst-${campo} .ms-opt input`).forEach(cb => cb.checked = true);
  msAtualizarLabel(campo); aplicarFiltros();
}

function msLimpar(campo) {
  msOpcoes[campo].forEach(e => e.checked = false);
  document.querySelectorAll(`#lst-${campo} .ms-opt input`).forEach(cb => cb.checked = false);
  msAtualizarLabel(campo); aplicarFiltros();
}

function msLimparTudo() { CAMPOS.forEach(c => msLimpar(c)); }
function msSelecionarTudo() { CAMPOS.forEach(c => msSelectAll(c)); }

function msAtualizarLabel(campo) {
  const sel = msOpcoes[campo].filter(e => e.checked);
  const tot = msOpcoes[campo].length;
  const lbl = document.getElementById('tlbl-' + campo);
  const trig = document.getElementById('trig-' + campo);
  if (sel.length === 0) { lbl.textContent = '(nenhum)'; trig.classList.add('active'); }
  else if (sel.length === tot) { lbl.textContent = campo === 'data' ? 'Todas' : 'Todos'; trig.classList.remove('active'); }
  else if (sel.length === 1) { lbl.textContent = sel[0].val; trig.classList.add('active'); }
  else { lbl.textContent = `${sel.length} selecionados`; trig.classList.add('active'); }
}

function aplicarFiltros() {
  const pass = {};
  CAMPOS.forEach(c => { pass[c] = new Set(msOpcoes[c].filter(e => e.checked).map(e => e.val)); });
  const filtradas = todasEncomendas.filter(e => {
    if (!pass.id.has(String(e.id).padStart(4,'0'))) return false;
    if (!pass.data.has(e.data))                      return false;
    if (!pass.cliente.has(e.cliente))                return false;
    if (!pass.tipo.has(e.cliente_tipo))              return false;
    if (!e.produtos.some(p => pass.produto.has(p.nome))) return false;
    return true;
  });
  renderTabela(filtradas);
}

function renderTabela(encomendas) {
  const tbody = document.getElementById('tabela-body');
  const empty = document.getElementById('empty-state');
  const contador = document.getElementById('contador');
  const total = todasEncomendas.length;
  const vis = encomendas.length;
  contador.textContent = (vis < total && total > 0)
    ? `${vis} de ${total} encomenda${total !== 1 ? 's' : ''}`
    : `${total} encomenda${total !== 1 ? 's' : ''}`;
  empty.style.display = vis === 0 ? 'block' : 'none';
  tbody.innerHTML = '';
  [...encomendas].reverse().forEach(e => {
    const produtosHTML = e.produtos.map(p => {
      const nota = p.notas ? `<div class="produto-tag-nota">↳ ${p.notas}</div>` : '';
      return `<div class="produto-tag"><strong>${p.nome}</strong> × ${p.quantidade}</div>${nota}`;
    }).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-family:'DM Mono',monospace;color:var(--muted);font-size:12px;">${String(e.id).padStart(4,'0')}</td>
      <td style="font-family:'DM Mono',monospace;font-size:12px;white-space:nowrap;">${e.data}<br><span style="color:var(--muted);font-size:11px">${e.hora}</span></td>
      <td style="font-weight:500;">${e.cliente}</td>
      <td><span class="badge-tipo badge-${e.cliente_tipo}">${e.cliente_tipo}</span></td>
      <td><div class="produtos-cell">${produtosHTML}</div></td>
      <td><button class="btn-download" onclick="downloadDoc(${e.id})">⬇ Word</button></td>
    `;
    tbody.appendChild(tr);
  });
}

async function carregarHistorico() {
  const res = await fetch('/api/encomendas');
  todasEncomendas = await res.json();
  CAMPOS.forEach(c => msInicializar(c));
  aplicarFiltros();
}

async function downloadDoc(id) { window.open(`/api/encomendas/${id}/download`, '_blank'); }
function exportarExcel() { window.open('/api/exportar-excel', '_blank'); }

function toast(msg, erro = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = erro ? 'error show' : 'show';
  setTimeout(() => { t.className = erro ? 'error' : ''; }, 3000);
}

adicionarProduto();
carregarHistorico();
